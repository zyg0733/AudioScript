name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies without model downloads
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (read only)
        run: pnpm lint
      - name: Regression tests
        run: pnpm test
      - name: Release configuration regression tests
        run: pnpm test:scripts
      - name: Validate model catalog
        run: pnpm verify:models
      - name: Validate fork identity and release endpoints
        run: |
          pnpm verify:project
          node scripts/verify-release-version.mjs
      - name: Build both frontend windows
        run: pnpm build:frontend
      - name: Check frontend entrypoints
        run: test -s dist/index.html && test -s dist/overlay.html

  rust:
    name: Rust (macOS ARM)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    timeout-minutes: 60
    steps:
      - name: Check macOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1,2)" = "26.4"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify sherpa-onnx native library cache
        shell: bash
        run: |
          found=$(find src-tauri/target/sherpa-onnx-prebuilt -type f \
            \( -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.a' \) -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi
      - name: Install typeshare CLI
        run: cargo install typeshare-cli --version 1.13.4 --locked
      - name: Verify generated IPC types
        run: |
          typeshare src-tauri --lang=typescript --output-file=src/shared/types.ts
          git diff --exit-code -- src/shared/types.ts
      - name: Rust regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --example model_smoke --example updater_verify
