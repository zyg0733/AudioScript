name: Build & Release

on:
  push:
    tags: ['v*']
  # SPEC §5.2：首次跑通前 MUST NOT 进发布流程，先手动触发验证整条链
  workflow_dispatch:
    inputs:
      release_mode:
        description: '手动安装包验证或配置自有签名的更新包验证'
        type: choice
        default: installers-only
        options:
          - installers-only
          - signed-updater

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_mode || 'signed-updater' }}
  cancel-in-progress: false

env:
  AUDIOSCRIPT_RELEASE_MODE: ${{ inputs.release_mode || 'signed-updater' }}
  TAURI_UPDATER_PUBLIC_KEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.release_mode == 'signed-updater') && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
  AUDIOSCRIPT_APTABASE_APP_KEY: ${{ vars.AUDIOSCRIPT_APTABASE_APP_KEY }}

jobs:
  release-config:
    name: Validate release configuration
    runs-on: ubuntu-latest
    outputs:
      updater_enabled: ${{ steps.release_config.outputs.updater_enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release metadata and regressions
        run: |
          node --test scripts/*.test.mjs
          node scripts/verify-project.mjs
          node scripts/verify-release-version.mjs
      - name: Configure required update artifacts
        id: release_config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-release.mjs
      - name: Prevent overwriting an existing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-destination.mjs
      - name: Install signing verification tools
        if: steps.release_config.outputs.updater_enabled == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Verify signing key pair and password
        if: steps.release_config.outputs.updater_enabled == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-updater-signing.mjs

  build-mac-arm:
    needs: release-config
    name: Build (macOS ARM)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert arm64 runner
        run: |-
          test "$(uname -m)" = arm64 ||
            { echo "::error::runner 不是 arm64——产物会是 x86_64 却被当成 ARM 发出去，需改用 macos-14 并显式 --target"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure optional updater artifacts
        id: release_config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-release.mjs

      # 钉版本：torch 要求 Python >= 3.10，runner 自带的 3.9 会让 pip 报「(from versions: none)」
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache sherpa-onnx native libs
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-onnx-1.13.8-${{ runner.os }}-${{ runner.arch }}

      # sherpa-onnx-sys 的 build.rs 只检查 lib/ 目录存在就跳过下载，
      # rust-cache 恢复出空目录时会让链接器找不到 .lib/.a。
      - name: Verify sherpa-onnx native libs
        shell: bash
        run: |-
          found=$(find src-tauri/target/sherpa-onnx-prebuilt -type f \
            \( -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.a' \) -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::warning::sherpa-onnx 预编译库缺失，清空缓存后重新下载"
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-${{ hashFiles('scripts/fetch-model.mjs') }}
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: mt-models-

      - name: Install typeshare CLI
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app (DMG)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config .cache/tauri-release.conf.json

      - name: Verify packaged app and real models
        run: |
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --example model_smoke --example updater_verify
          node scripts/fetch-smoke-fixture.mjs
          node scripts/verify-installers.mjs --platform macos-arm64 --smoke-executable src-tauri/target/release/examples/model_smoke --smoke-wav .cache/release-smoke/2.wav

      - name: Verify signed updater and reject tampering
        if: steps.release_config.outputs.updater_enabled == 'true'
        run: node scripts/verify-updater-artifacts.mjs --platform macos-arm64 --verify-executable src-tauri/target/release/examples/updater_verify

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-macOS-ARM
          path: .cache/installer-verification/*
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-macOS-ARM
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Upload updater artifacts
        if: steps.release_config.outputs.updater_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-macOS-ARM
          path: src-tauri/target/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
          compression-level: 0

  # 发布前需记录各平台采集、置顶、托盘与热键的真机验收结果。
  build-windows:
    needs: release-config
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # ct2rs/sherpa-onnx 的 CMake 构建用 /MT，Rust 默认 /MD，不对齐会报 LNK2038/LNK1169
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure optional updater artifacts
        id: release_config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-release.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache sherpa-onnx native libs
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-onnx-1.13.8-${{ runner.os }}-${{ runner.arch }}

      # sherpa-onnx-sys 的 build.rs 只检查 lib/ 目录存在就跳过下载，
      # rust-cache 恢复出空目录时会让链接器找不到 .lib/.a。
      - name: Verify sherpa-onnx native libs
        shell: bash
        run: |-
          found=$(find src-tauri/target/sherpa-onnx-prebuilt -type f \
            \( -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.a' \) -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::warning::sherpa-onnx 预编译库缺失，清空缓存后重新下载"
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi

      - name: Cache typeshare CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-1.13.4-${{ runner.os }}

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-${{ hashFiles('scripts/fetch-model.mjs') }}
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: mt-models-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typeshare CLI
        shell: bash
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis,msi --config .cache/tauri-release.conf.json

      - name: Verify packaged apps and real models
        shell: bash
        run: |
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --example model_smoke --example updater_verify
          node scripts/fetch-smoke-fixture.mjs
          node scripts/verify-installers.mjs --platform windows-x64 --smoke-executable src-tauri/target/release/examples/model_smoke.exe --smoke-wav .cache/release-smoke/2.wav

      - name: Verify signed updaters and reject tampering
        if: steps.release_config.outputs.updater_enabled == 'true'
        run: node scripts/verify-updater-artifacts.mjs --platform windows-x64 --verify-executable src-tauri/target/release/examples/updater_verify.exe

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-Windows-x64
          path: .cache/installer-verification/*
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-Windows-x64
          path: |-
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0

      - name: Upload NSIS updater artifacts
        if: steps.release_config.outputs.updater_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe*
          if-no-files-found: error
          compression-level: 0

      - name: Upload MSI updater artifacts
        if: steps.release_config.outputs.updater_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-Windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi*
          if-no-files-found: error
          compression-level: 0

  build-linux:
    needs: release-config
    name: Build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # CI 无 FUSE，AppImage 工具链需解包运行
      APPIMAGE_EXTRACT_AND_RUN: 1
      # 不要删：sherpa-onnx 的 onnxruntime 用旧 C++ ABI，CTranslate2 默认新 ABI，
      # 混链会导致点「开始转写」闪退
      CXXFLAGS: -D_GLIBCXX_USE_CXX11_ABI=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libssl-dev build-essential libxdo-dev \
            libpipewire-0.3-dev cmake ninja-build

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure optional updater artifacts
        id: release_config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-release.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # CXXFLAGS 改了必须换 key，否则会复用按新 ABI 编好的 CTranslate2
          key: cxx-abi-0

      - name: Cache sherpa-onnx native libs
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-onnx-1.13.8-${{ runner.os }}-${{ runner.arch }}

      # sherpa-onnx-sys 的 build.rs 只检查 lib/ 目录存在就跳过下载，
      # rust-cache 恢复出空目录时会让链接器找不到 .lib/.a。
      - name: Verify sherpa-onnx native libs
        shell: bash
        run: |-
          found=$(find src-tauri/target/sherpa-onnx-prebuilt -type f \
            \( -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.a' \) -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::warning::sherpa-onnx 预编译库缺失，清空缓存后重新下载"
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi

      - name: Cache typeshare CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-1.13.4-${{ runner.os }}

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-${{ hashFiles('scripts/fetch-model.mjs') }}
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: mt-models-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typeshare CLI
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage --config .cache/tauri-release.conf.json

      - name: Verify packaged apps and real models
        run: |
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --example model_smoke --example updater_verify
          node scripts/fetch-smoke-fixture.mjs
          node scripts/verify-installers.mjs --platform linux-x64 --smoke-executable src-tauri/target/release/examples/model_smoke --smoke-wav .cache/release-smoke/2.wav

      - name: Verify signed updaters and reject tampering
        if: steps.release_config.outputs.updater_enabled == 'true'
        run: node scripts/verify-updater-artifacts.mjs --platform linux-x64 --verify-executable src-tauri/target/release/examples/updater_verify

      - name: Upload verifier for aggregate validation
        if: steps.release_config.outputs.updater_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-verifier-Linux-x64
          path: src-tauri/target/release/examples/updater_verify
          if-no-files-found: error

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-Linux-x64
          path: .cache/installer-verification/*
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-Linux-x64
          path: |-
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload updater artifacts
        if: steps.release_config.outputs.updater_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-Linux-x64
          path: src-tauri/target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error
          compression-level: 0

      - name: Upload deb updater artifacts
        if: steps.release_config.outputs.updater_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-Linux-x64-deb
          path: src-tauri/target/release/bundle/deb/*.deb*
          if-no-files-found: error
          compression-level: 0

  verify-signed-updates:
    name: Verify signed release candidate
    needs: [release-config, build-mac-arm, build-windows, build-linux]
    if: needs.release-config.outputs.updater_enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 每个平台只产出本平台的 .sig，这里合成 updater 所需的单一 latest.json。
      - name: Generate updater manifest
        run: |-
          chmod +x updater-verifier-Linux-x64/updater_verify
          VERSION=$(node -p "require('./package.json').version")
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          node scripts/make-updater-manifest.mjs \
            --version "$VERSION" \
            --base-url "$BASE" \
            --verify-executable updater-verifier-Linux-x64/updater_verify \
            --platform "darwin-aarch64=$(ls updater-macOS-ARM/*.app.tar.gz)" \
            --platform "darwin-aarch64-app=$(ls updater-macOS-ARM/*.app.tar.gz)" \
            --platform "windows-x86_64=$(ls updater-Windows-x64/*-setup.exe)" \
            --platform "windows-x86_64-nsis=$(ls updater-Windows-x64/*-setup.exe)" \
            --platform "windows-x86_64-msi=$(ls updater-Windows-x64-msi/*.msi)" \
            --platform "linux-x86_64=$(ls updater-Linux-x64/*.AppImage)" \
            --platform "linux-x86_64-appimage=$(ls updater-Linux-x64/*.AppImage)" \
            --platform "linux-x86_64-deb=$(ls updater-Linux-x64-deb/*.deb)"

      - name: Prepare only verified release files
        run: node scripts/prepare-signed-release.mjs

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: release-files/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish verified release
    needs: verify-signed-updates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release-files
      - name: Recheck release destination
        run: |
          node scripts/check-release-destination.mjs
          TAG_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          test "$TAG_COMMIT" = "$GITHUB_SHA"
      - name: Upload draft from verified candidate
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --draft \
            --title "AudioScript $GITHUB_REF_NAME" --generate-notes \
            --notes '本版内置本 fork 的更新公钥，启用绑定版本的签名更新。0.2.11 用户需先手动安装本版，此后才能自动更新。安装包、模型推理、启动预算及所有更新签名均经 CI 验证。更新签名不等于 Apple 公证或 Windows 发布者签名；完整 GUI 和真实录音权限仍需真机验收。'
      - name: Verify uploaded files before publication
        run: |
          RELEASE_API=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl)
          gh api "$RELEASE_API" > release-metadata.json
          TAG_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          node scripts/verify-release-upload.mjs --metadata release-metadata.json --asset-dir release-files --tag-commit "$TAG_COMMIT" --draft
      - name: Publish latest release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Verify published release
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > release-metadata.json
          TAG_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          node scripts/verify-release-upload.mjs --metadata release-metadata.json --asset-dir release-files --tag-commit "$TAG_COMMIT" --published
